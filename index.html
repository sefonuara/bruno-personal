<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1013;
    --bg-elevated: #17181D;
    --bg-card: #1C1D23;
    --line: #2A2C33;
    --text: #EDEDEF;
    --text-dim: #9497A0;
    --accent: #FF4429;
    --accent-soft: rgba(255,68,41,0.14);
    --accent-line: rgba(255,68,41,0.35);
  }
  :root[data-theme="light"]{
    --bg: #F3F3F5;
    --bg-elevated: #FFFFFF;
    --bg-card: #F0F0F3;
    --line: #E0E0E5;
    --text: #17181D;
    --text-dim: #6B6D76;
    --accent: #E8481F;
    --accent-soft: rgba(232,72,31,0.09);
    --accent-line: rgba(232,72,31,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    transition:background-color 0.15s, color 0.15s;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.02em;
    font-weight:400;
  }
  .hidden{display:none !important;}
  button{
    font-family:'Inter', sans-serif;
    cursor:pointer;
    border:none;
    border-radius:8px;
  }
  input{
    font-family:'Inter', sans-serif;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    width:100%;
  }
  input:focus{outline:none; border-color:var(--accent-line);}
  textarea{
    font-family:'Inter', sans-serif;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    width:100%;
    resize:vertical;
  }
  textarea:focus{outline:none; border-color:var(--accent-line);}

  /* ---------- Login ---------- */
  #login-view{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-box{
    width:100%;
    max-width:380px;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 32px;
  }
  .login-box .brand{
    font-size:44px;
    line-height:1;
    color:var(--accent);
    margin-bottom:4px;
  }
  .login-box .sub{
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:22px;
  }
  .tabs{
    display:flex;
    gap:4px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:9px;
    padding:3px;
    margin-bottom:24px;
  }
  .tab-btn{
    flex:1;
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    padding:8px;
    border-radius:6px;
  }
  .tab-btn.active{background:var(--accent-soft); color:var(--accent);}

  .password-wrap{position:relative;}
  .password-wrap input{padding-right:56px;}
  .password-toggle{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:transparent;
    color:var(--text-dim);
    font-size:12px;
    font-weight:600;
    padding:6px 8px;
    border-radius:6px;
  }
  .password-toggle:hover{color:var(--accent); background:var(--bg-card);}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:#fff;
    padding:12px;
    font-weight:600;
    font-size:14px;
    margin-top:8px;
    transition:filter 0.15s;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:0.5; cursor:default;}
  .error-msg{
    color:var(--accent);
    font-size:13px;
    margin-top:12px;
    display:none;
  }

  /* ---------- App shell ---------- */
  #app-view{
    display:flex;
    min-height:100vh;
  }
  #sidebar{
    width:260px;
    flex-shrink:0;
    background:var(--bg-elevated);
    border-right:1px solid var(--line);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    overflow-y:auto;
  }
  #sidebar .brand{
    font-size:28px;
    color:var(--accent);
    margin-bottom:2px;
    padding:0 8px;
  }
  #sidebar .who{
    color:var(--text-dim);
    font-size:12px;
    padding:0 8px;
    margin-bottom:24px;
  }
  #student-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .student-item{
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
  }
  .student-item:hover{background:var(--bg-card);}
  .student-item.active{background:var(--accent-soft); color:var(--accent);}
  #add-student-btn{
    background:var(--bg-card);
    color:var(--text);
    border:1px dashed var(--line);
    padding:10px;
    font-size:13px;
    margin-top:12px;
  }
  #add-student-btn:hover{border-color:var(--accent-line); color:var(--accent);}
  #admin-panel-btn, #student-routine-btn, #student-profile-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:10px;
    font-size:13px;
    margin-top:12px;
    text-align:left;
  }
  #admin-panel-btn.active, #student-routine-btn.active, #student-profile-btn.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line);}
  #admin-panel-btn:hover, #student-routine-btn:hover, #student-profile-btn:hover{color:var(--accent);}
  #student-routine-btn{margin-top:0;}
  .contact-trainer-btn{
    display:block;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:10px;
    font-size:13px;
    font-weight:600;
    margin-top:12px;
    text-align:left;
    text-decoration:none;
  }
  .contact-trainer-btn:hover{border-color:#25D366; color:#25D366;}

  .theme-switch-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:16px;
    padding:8px 0;
    font-size:13px;
  }
  .theme-switch{
    position:relative;
    width:44px;
    height:24px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:999px;
    padding:0;
    flex-shrink:0;
  }
  .theme-switch-knob{
    position:absolute;
    top:2px;
    left:2px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--accent);
    transition:left 0.15s;
  }
  :root[data-theme="light"] .theme-switch-knob{left:23px;}
  #logout-btn{
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    padding:10px;
    margin-top:8px;
    text-align:left;
  }
  #logout-btn:hover{color:var(--text);}

  #main-content{
    flex:1;
    padding:40px 48px;
    overflow-y:auto;
    max-width:900px;
  }
  #main-content h1{font-size:38px;}
  .subtitle{color:var(--text-dim); font-size:14px; margin-bottom:32px;}
  .routine-start-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    margin-bottom:14px;
  }
  .routine-start-row label{
    font-size:12px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.04em;
    white-space:nowrap;
  }
  .routine-start-row input{
    width:auto;
    padding:6px 10px;
    font-size:13px;
  }
  .routine-start-display{
    color:var(--text-dim);
    font-size:13px;
    margin-top:-14px;
    margin-bottom:20px;
  }

  .routine-alerts{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:4px;
    margin-bottom:24px;
  }
  .routine-type-request{
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:13px;
    padding:6px 12px;
    border-radius:8px;
  }
  .injury-warning{
    display:inline-block;
    background:rgba(240,180,41,0.14);
    color:#F0B429;
    font-size:13px;
    padding:6px 12px;
    border-radius:8px;
  }
  .routine-header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }
  .routine-header-actions{display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap;}
  .duplicate-btn, .export-pdf-btn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
  }
  .duplicate-btn:hover, .export-pdf-btn:hover{border-color:var(--accent-line); color:var(--accent);}
  .duplicate-target-list{
    display:flex;
    flex-direction:column;
    gap:2px;
    max-height:260px;
    overflow-y:auto;
    margin-bottom:8px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px;
  }
  .duplicate-target-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:7px;
    font-size:14px;
    cursor:pointer;
  }
  .duplicate-target-item:hover{background:var(--bg-card);}
  .duplicate-target-item input{width:16px; height:16px; accent-color:var(--accent); flex-shrink:0;}

  .empty-state{
    color:var(--text-dim);
    font-size:14px;
    padding:60px 20px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:12px;
  }

  /* day cards */
  .day-card{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .day-card.day-hidden{opacity:0.6; border-style:dashed;}
  .day-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    gap:12px;
  }
  .day-header-title{flex:1; min-width:0;}
  .day-collapse-btn{
    flex-shrink:0;
    background:transparent;
    color:var(--text-dim);
    width:26px;
    height:26px;
    border-radius:6px;
    font-size:13px;
    line-height:1;
  }
  .day-collapse-btn:hover{background:var(--bg-card); color:var(--text);}
  .day-card.day-collapsed .day-header{border-bottom:none;}
  .day-card.day-collapsed .day-body{display:none;}
  .day-header .tag{
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    padding:3px 8px;
    border-radius:5px;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .day-header .tag.tag-hidden{
    background:var(--bg-card);
    color:var(--text-dim);
    margin-left:6px;
  }
  .day-header h3{font-size:22px;}
  .day-actions{display:flex; gap:6px;}
  .icon-btn{
    background:transparent;
    color:var(--text-dim);
    padding:6px 10px;
    font-size:12px;
    border-radius:6px;
  }
  .icon-btn:disabled{opacity:0.3; cursor:default;}
  .icon-btn:disabled:hover{background:transparent; color:var(--text-dim);}
  .icon-btn:hover{background:var(--bg-card); color:var(--text);}
  .icon-btn.danger:hover{color:var(--accent);}

  .exercise-list{display:flex; flex-direction:column;}

  .superset-pair{
    background:rgba(0,0,0,0.22);
    border-left:2px solid var(--accent);
  }
  .superset-pair .exercise-item{border-bottom:1px dashed var(--line);}
  .superset-pair .exercise-item:last-child{border-bottom:1px solid var(--line);}
  .superset-badge{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 20px 0 18px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .superset-unlink-btn{
    background:transparent;
    color:var(--text-dim);
    font-size:11px;
    font-weight:600;
    text-transform:none;
    letter-spacing:normal;
    padding:2px 6px;
  }
  .superset-unlink-btn:hover{color:var(--accent);}
  .superset-link-btn{
    display:block;
    width:100%;
    background:transparent;
    color:var(--text-dim);
    font-size:11px;
    padding:6px 20px;
    text-align:left;
    border-bottom:1px solid var(--line);
  }
  .superset-link-btn:hover{color:var(--accent); background:var(--bg-card);}
  .exercise-item{
    display:flex;
    gap:16px;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .exercise-item:last-child{border-bottom:none;}
  .ex-thumb-lg{
    width:76px; height:76px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--line);
    cursor:pointer;
    flex-shrink:0;
    background:#000;
  }
  .ex-thumb-placeholder{
    background:var(--bg-card);
    cursor:default;
  }
  .ex-content{
    flex:1; min-width:0;
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "title actions"
      "meta   meta"
      "notes  notes";
    column-gap:10px;
    row-gap:8px;
    align-items:start;
  }
  .ex-title{grid-area:title; font-weight:700; font-size:15px; line-height:1.3; align-self:center;}
  .ex-actions{grid-area:actions; align-self:center;}
  .ex-meta{
    grid-area:meta;
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:16px;
    row-gap:2px;
    align-items:start;
  }
  .ex-meta-block{display:block;}
  .ex-meta-label{
    display:block;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:3px;
  }
  .ex-reps{
    font-weight:600;
    font-size:14px;
    color:var(--text);
    padding:10px 0;
  }
  .ex-notes-block{grid-area:notes;}
  .ex-meta .weight-input, .ex-notes-block .notes-input{min-width:0;}
  .lightbox-img{
    max-width:90vw;
    max-height:90vh;
    border-radius:12px;
    border:1px solid var(--line);
  }

  @media (max-width: 480px){
    .exercise-item{gap:12px; padding:14px;}
    .ex-thumb-lg{width:60px; height:60px;}
    .ex-content{
      grid-template-columns:1fr auto;
      grid-template-areas:
        "title title"
        "meta  meta"
        "notes notes"
        ".     actions";
      row-gap:10px;
    }
    .ex-actions{align-self:end;}
    .row-actions{justify-content:flex-end;}
  }

  /* GIF picker */
  .modal-wide{max-width:720px;}
  .gif-filters{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .gif-filters select{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px;
    font-size:13px;
    font-family:'Inter', sans-serif;
  }
  .gif-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    max-height:420px;
    overflow-y:auto;
    padding-right:4px;
    margin-bottom:16px;
  }
  .gif-card{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px;
    text-align:left;
    color:var(--text);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .gif-card:hover{border-color:var(--accent-line);}
  .gif-card img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:#000;}
  .gif-card-name{font-size:12px; font-weight:600; line-height:1.2;}
  .gif-card-name-en{font-size:11px; color:var(--text-dim); font-style:italic; line-height:1.2;}
  .gif-card-tags{font-size:11px; color:var(--text-dim);}
  .gif-more-note{
    grid-column:1 / -1;
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    padding:10px;
  }

  /* Exercise modal gif field */
  .gif-preview-empty{
    background:var(--bg);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:16px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
  }
  #gif-preview img{
    width:100%;
    max-height:180px;
    object-fit:contain;
    border-radius:8px;
    background:#000;
  }
  .gif-preview-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .gif-preview-actions button{flex:none; padding:8px 14px; font-size:12px;}

  .notes-input{
    background:transparent;
    border:1px solid transparent;
    color:var(--text-dim);
    font-size:13px;
    padding:8px 8px;
    border-radius:6px;
    width:100%;
  }
  .notes-input:hover{background:var(--bg-card);}
  .notes-input:focus{
    background:var(--bg-card);
    border-color:var(--accent-line);
    color:var(--text);
  }
  .row-actions{display:flex; gap:4px; justify-content:flex-end; flex-wrap:wrap;}

  .add-exercise-row{
    padding:10px 20px;
  }
  .add-exercise-row button{
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    padding:6px 0;
  }
  .add-exercise-row button:hover{color:var(--accent);}

  #add-day-btn{
    background:var(--bg-card);
    border:1px dashed var(--line);
    color:var(--text-dim);
    padding:14px;
    width:100%;
    font-size:14px;
  }
  #add-day-btn:hover{border-color:var(--accent-line); color:var(--accent);}

  /* ---------- Admin panel ---------- */
  /* ---------- Student profile ---------- */
  .profile-form{
    max-width:420px;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:14px;
    padding:24px;
  }
  .profile-form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .optional-tag{color:var(--text-dim); font-weight:400; text-transform:none; letter-spacing:0;}
  .profile-form select{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    width:100%;
    font-family:'Inter', sans-serif;
  }
  .day-checkbox-group{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .day-checkbox-item{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 12px 6px 10px;
    font-size:13px;
    cursor:pointer;
  }
  .day-checkbox-item:has(input:checked){background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent);}
  .day-checkbox-item input{width:14px; height:14px; accent-color:var(--accent); flex-shrink:0;}
  .profile-save-btn{width:auto; padding:10px 24px; margin-top:6px;}
  .saved-msg{
    display:none;
    color:#6EE7A8;
    font-size:13px;
    margin-top:12px;
  }

  .admin-stats{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:28px;
  }
  .stat-card{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 22px;
    flex:1;
    min-width:130px;
  }
  .stat-num{
    font-family:'Bebas Neue', sans-serif;
    font-size:36px;
    color:var(--accent);
    line-height:1;
  }
  .stat-label{
    color:var(--text-dim);
    font-size:12px;
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .admin-table-wrap{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:14px;
    overflow-x:auto;
  }
  table.admin-table{width:100%; border-collapse:collapse; min-width:640px;}
  table.admin-table th{
    text-align:left;
    font-size:11px;
    color:var(--text-dim);

function renderExerciseItem(ex, editable, day, idx, total) {
  return `
    <div class="exercise-item">
      ${ex.gif_url
        ? `<img class="ex-thumb-lg" src="${ex.gif_url}" alt="" data-action="view-gif" data-url="${ex.gif_url}" loading="lazy">`
        : `<div class="ex-thumb-lg ex-thumb-placeholder"></div>`}
      <div class="ex-content">
        <div class="ex-title">${ex.name}</div>
        ${editable ? `<div class="ex-actions row-actions">
          <button class="icon-btn" data-action="move-exercise-up" data-ex="${ex.id}" data-day="${day.id}" ${idx === 0 ? 'disabled' : ''} aria-label="Subir ejercicio">▲</button>
          <button class="icon-btn" data-action="move-exercise-down" data-ex="${ex.id}" data-day="${day.id}" ${idx === total - 1 ? 'disabled' : ''} aria-label="Bajar ejercicio">▼</button>
          <button class="icon-btn" data-action="edit-exercise" data-ex="${ex.id}" data-day="${day.id}">Editar</button>
          <button class="icon-btn danger" data-action="delete-exercise" data-ex="${ex.id}">Borrar</button>
        </div>` : ''}
        <div class="ex-meta">
          <div class="ex-meta-block">
            <div class="ex-meta-label">Series y reps</div>
            <div class="ex-reps">${ex.reps ?? '—'}</div>
          </div>
          <div class="ex-meta-block">
            <div class="ex-meta-label">Peso máximo total (kg) <button class="progress-btn" data-action="open-progress" data-student="${day.student_id}" data-ex-name="${escapeAttr(ex.name)}" aria-label="Ver progreso">📈</button></div>
            <input type="number" step="0.5" min="0" class="weight-input" data-ex="${ex.id}" data-day="${day.id}" data-ex-name="${escapeAttr(ex.name)}" data-student="${day.student_id}" data-original="${ex.weight_kg ?? ''}" value="${ex.weight_kg ?? ''}" placeholder="kg">
          </div>
        </div>
        <div class="ex-notes-block">
          <div class="ex-meta-label">Notas</div>
          <input type="text" class="notes-input" data-ex="${ex.id}" data-day="${day.id}" value="${escapeAttr(ex.notes)}" placeholder="Comentarios...">
        </div>
      </div>
    </div>`;
}

function renderExerciseList(exercises, editable, day) {
  let out = '';
  const total = exercises.length;
  for (let i = 0; i < exercises.length; i++) {
    const ex = exercises[i];
    if (ex._pairedAsSecond) continue;
    const next = exercises[i + 1];

    if (ex.groups_with_next && next) {
      next._pairedAsSecond = true;
      out += `
        <div class="superset-pair">
          <div class="superset-badge">
            Biserie
            ${editable ? `<button class="superset-unlink-btn" data-action="toggle-superset" data-ex="${ex.id}" data-day="${day.id}">Separar</button>` : ''}
          </div>
          ${renderExerciseItem(ex, editable, day, i, total)}
          ${renderExerciseItem(next, editable, day, i + 1, total)}
        </div>`;
    } else {
      out += renderExerciseItem(ex, editable, day, i, total);
      if (editable && next) {
        out += `<button class="superset-link-btn" data-action="toggle-superset" data-ex="${ex.id}" data-day="${day.id}">+ Unir en biserie con el siguiente</button>`;
      }
    }
  }
  return out;
}

// ---------- Admin panel ----------
function addMonths(date, months) {
  const d = new Date(date);
  d.setMonth(d.getMonth() + Number(months));
  return d;
}

function formatDateEs(date) {
  return date.toLocaleDateString('es-AR');
}

function parseDateOnly(dateStr) {
  // "YYYY-MM-DD" from Postgres date columns has no time/timezone info.
  // new Date(str) parses it as UTC midnight, which toLocaleDateString then
  // shifts back a day in timezones behind UTC (e.g. Argentina). Building
  // the Date from local y/m/d components avoids that shift entirely.
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function computePaymentStatus(profile, payments) {
  const totalMonths = (payments || []).reduce((sum, p) => sum + Number(p.period_months || 1), 0);
  const start = new Date(profile.created_at);
  const paidThrough = addMonths(start, totalMonths);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((paidThrough - today) / 86400000);
  let status;
  if (diffDays < 0) status = 'adeuda';
  else if (diffDays > 35) status = 'adelantado';
  else status = 'al_dia';
  return { status, paidThrough, diffDays };
}

function paymentBadge(info) {
  const labels = { adeuda: 'Adeuda', al_dia: 'Al día', adelantado: 'Adelantado' };
  const dateStr = formatDateEs(info.paidThrough);
  const sub = info.status === 'adeuda' ? `desde ${dateStr}` : `vence ${dateStr}`;
  return `<span class="pay-badge pay-${info.status}">${labels[info.status]}</span><div class="pay-sub">${sub}</div>`;
}

function renderPersonalInfoPanel(s) {
  const sexLabels = { femenino: 'Femenino', masculino: 'Masculino', otro: 'Otro' };
  let age = null;
  if (s.birth_date) {
    const b = parseDateOnly(s.birth_date);
    const today = new Date();
    age = today.getFullYear() - b.getFullYear() - ((today.getMonth() < b.getMonth() || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate())) ? 1 : 0);
  }
  const rows = [
    ['Sexo', s.sex ? (sexLabels[s.sex] || s.sex) : '—'],
    ['Fecha de nacimiento', s.birth_date ? `${formatDateEs(parseDateOnly(s.birth_date))}${age !== null ? ` (${age} años)` : ''}` : '—'],
    ['Altura', s.height_cm ? `${s.height_cm} cm` : '—'],
    ['Peso', s.weight_kg ? `${s.weight_kg} kg` : '—'],
    ['Gimnasio', s.gym_name || '—'],
    ['Tipo de rutina pedido', s.desired_routine_type || '—'],
    ['Días que entrena', s.training_days && s.training_days.length ? s.training_days.join(', ') : '—'],
    ['Lesiones', s.injuries || '—'],
  ];
  return `<div class="personal-info-panel">
    ${rows.map(([label, value]) => `
      <div class="personal-info-item">
        <div class="ex-meta-label">${label}</div>
        <div>${value}</div>
      </div>
    `).join('')}
  </div>`;
}

      options: {
        responsive: true,

        scales: {
          y: { beginAtZero: false, ticks: { color: '#9497A0' }, grid: { color: 'rgba(255,255,255,0.06)' } },

  document.getElementById('lightbox-backdrop').addEventListener('click', closeModal);
}

function openGifPicker(onSelect) {
  const db = window.EXERCISE_DB || [];
  const bodyParts = [...new Set(db.map(e => e.bodyPart))].sort();
  const equipments = [...new Set(db.map(e => e.equipment))].sort();

  pickerModalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal modal-wide">
        <h3>Elegir GIF</h3>
        <div class="gif-filters">
          <input type="text" id="gif-search" placeholder="Buscar por nombre...">
          <select id="gif-bodypart"><option value="">Grupo muscular (todos)</option>
            ${bodyParts.map(b => `<option value="${b}">${BODY_PART_ES[b] || b}</option>`).join('')}
          </select>
          <select id="gif-equipment"><option value="">Equipamiento (todos)</option>
            ${equipments.map(e => `<option value="${e}">${EQUIPMENT_ES[e] || e}</option>`).join('')}
          </select>
        </div>
        <div id="gif-results" class="gif-grid"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="gif-picker-close">Cerrar</button>
        </div>
      </div>
    </div>`;

  function closePicker() { pickerModalRoot.innerHTML = ''; }
  document.getElementById('gif-picker-close').addEventListener('click', closePicker);

  const searchInput = document.getElementById('gif-search');
  const bodyPartSelect = document.getElementById('gif-bodypart');
  const equipmentSelect = document.getElementById('gif-equipment');
  const resultsEl = document.getElementById('gif-results');

  function renderResults() {
    const q = searchInput.value.trim().toLowerCase();
    const bp = bodyPartSelect.value;
    const eq = equipmentSelect.value;
    let matches = db.filter(ex =>
      (!q || ex.name.toLowerCase().includes(q) || (ex.nameEs || '').toLowerCase().includes(q)) &&
      (!bp || ex.bodyPart === bp) &&
      (!eq || ex.equipment === eq)
    );
    const total = matches.length;
    matches = matches.slice(0, 60);

    if (!total) {
      resultsEl.innerHTML = `<div class="empty-state">No se encontraron ejercicios con esos filtros.</div>`;
      return;
    }

    resultsEl.innerHTML = matches.map(ex => `
      <button type="button" class="gif-card" data-id="${ex.id}">
        <img src="${gifUrlFor(ex.id)}" loading="lazy" alt="${escapeAttr(ex.name)}">
        <div class="gif-card-name">${ex.nameEs || ex.name}</div>
        <div class="gif-card-name-en">${ex.name}</div>
        <div class="gif-card-tags">${BODY_PART_ES[ex.bodyPart] || ex.bodyPart} · ${EQUIPMENT_ES[ex.equipment] || ex.equipment}</div>
      </button>
    `).join('') + (total > 60 ? `<div class="gif-more-note">Mostrando 60 de ${total}. Afiná la búsqueda para ver más.</div>` : '');

    resultsEl.querySelectorAll('.gif-card').forEach(card => {
      card.addEventListener('click', () => {
        const ex = db.find(e => e.id === card.dataset.id);
        onSelect(ex);
        closePicker();
      });
    });
  }

  searchInput.addEventListener('input', renderResults);
  bodyPartSelect.addEventListener('change', renderResults);
  equipmentSelect.addEventListener('change', renderResults);
  renderResults();
}

// ---------- Modals ----------
function closeModal() { modalRoot.innerHTML = ''; }

async function saveNotes(input) {
  const exId = input.dataset.ex;
  const value = input.value.trim() || null;
  input.style.borderColor = '';
  const { error } = await supabase.from('exercises').update({ notes: value }).eq('id', exId);
  if (error) {
    input.style.borderColor = 'var(--accent-line)';
    input.title = 'No se pudo guardar: ' + error.message;
  } else {
    input.title = '';
  }
}

async function saveWeight(input) {
  const exId = input.dataset.ex;
  const raw = input.value.trim();
  const value = raw === '' ? null : parseFloat(raw);
  const original = input.dataset.original === '' ? null : parseFloat(input.dataset.original);
  input.style.borderColor = '';

  const { error } = await supabase.from('exercises').update({ weight_kg: value }).eq('id', exId);
  if (error) {
    input.style.borderColor = 'var(--accent-line)';
    input.title = 'No se pudo guardar: ' + error.message;
    return;
  }
  input.title = '';

  // Si el valor realmente cambió y es un número válido, queda registrado solo en el historial de progreso.
  if (value !== null && !isNaN(value) && value !== original) {
    const { error: logError } = await supabase.from('weight_logs').insert({
      student_id: input.dataset.student,
      exercise_name: input.dataset.exName,
      weight_kg: value,
    });
    if (!logError) {
      input.dataset.original = String(value);
    }
  } else if (value === null) {
    input.dataset.original = '';
  }
}

// ---------- Duplicate routine / day ----------
function openDuplicateModal(sourceStudentId, dayId = null) {
  const sourceStudent = students.find(s => s.id === sourceStudentId);
  const others = students.filter(s => s.id !== sourceStudentId);

  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <h3>${dayId ? 'Duplicar día' : 'Duplicar rutina'}</h3>
        <div class="sub" style="margin-bottom:16px;">${dayId
          ? `Copiá este día a otro alumno.`
          : `Copiá la rutina de <strong>${sourceStudent ? sourceStudent.full_name : 'este alumno'}</strong> a otro alumno.`} Se agrega como día${dayId ? '' : 's'} nuevo${dayId ? '' : 's'}, no borra lo que ya tenga.</div>
        ${others.length ? `<div class="duplicate-target-list">
          ${others.map(s => `
            <label class="duplicate-target-item">
              <input type="checkbox" class="duplicate-target-check" value="${s.id}">
              <span>${s.full_name}</span>
            </label>
          `).join('')}
        </div>` : `<div class="empty-state">No hay otros alumnos activos para copiarle la rutina.</div>`}
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">Cancelar</button>
          <button class="btn-primary" id="modal-save" ${others.length ? '' : 'disabled'}>Duplicar</button>
        </div>
        <div class="error-msg" id="duplicate-error"></div>
      </div>
    </div>`;

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async () => {
    const targets = [...document.querySelectorAll('.duplicate-target-check:checked')].map(c => c.value);
    if (!targets.length) return;

    const saveBtn = document.getElementById('modal-save');
    const errBox = document.getElementById('duplicate-error');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Duplicando...';
    errBox.style.display = 'none';

    try {
      if (dayId) {
        await duplicateDay(dayId, targets);
      } else {
        await duplicateRoutine(sourceStudentId, targets);
      }
      closeModal();
    } catch (err) {
      errBox.textContent = 'No se pudo duplicar: ' + err.message;
      errBox.style.display = 'block';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Duplicar';
    }
  });
}

async function copyDayToStudent(day, targetId) {
  const { count } = await supabase
    .from('routine_days')
    .select('*', { count: 'exact', head: true })
    .eq('student_id', targetId);
  const orderOffset = count || 0;

  const { data: newDay, error: dayError } = await supabase
    .from('routine_days')
    .insert({ student_id: targetId, day_label: day.day_label, day_order: orderOffset })
    .select()
    .single();
  if (dayError) throw dayError;

  const exercises = (day.exercises || []).sort((a, b) => a.exercise_order - b.exercise_order);
  for (const ex of exercises) {
    const { error: exError } = await supabase.from('exercises').insert({
      routine_day_id: newDay.id,
      name: ex.name,
      sets: ex.sets,
      reps: ex.reps,
      weight_kg: null,
      notes: null,
      gif_url: ex.gif_url,
      groups_with_next: ex.groups_with_next,
      exercise_order: ex.exercise_order,
    });
    if (exError) throw exError;
  }
}

async function duplicateDay(dayId, targetStudentIds) {
  const { data: day, error: fetchError } = await supabase
    .from('routine_days')
    .select('*, exercises(*)')
    .eq('id', dayId)
    .single();
  if (fetchError) throw fetchError;

  for (const targetId of targetStudentIds) {
    await copyDayToStudent(day, targetId);
  }
}

async function duplicateRoutine(sourceStudentId, targetStudentIds) {
  const { data: sourceDays, error: fetchError } = await supabase
    .from('routine_days')
    .select('*, exercises(*)')
    .eq('student_id', sourceStudentId)
    .order('day_order');
  if (fetchError) throw fetchError;
  if (!sourceDays || !sourceDays.length) throw new Error('Este alumno no tiene días de rutina para copiar.');

  for (const targetId of targetStudentIds) {
    for (const day of sourceDays) {
      await copyDayToStudent(day, targetId);
    }
  }
}

function openDayModal(studentId, dayId = null) {
  const isEdit = !!dayId;
  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <h3>${isEdit ? 'Renombrar día' : 'Nuevo día de rutina'}</h3>
        <div class="field">
          <label>Nombre del día</label>
          <input type="text" id="day-label-input" placeholder="Ej: Día 1 - Empuje">
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">Cancelar</button>
          <button class="btn-primary" id="modal-save">Guardar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async () => {
    const label = document.getElementById('day-label-input').value.trim();
    if (!label) return;
    if (isEdit) {
      await supabase.from('routine_days').update({ day_label: label }).eq('id', dayId);
    } else {
      const { count } = await supabase.from('routine_days').select('*', { count: 'exact', head: true }).eq('student_id', studentId);
      await supabase.from('routine_days').insert({ student_id: studentId, day_label: label, day_order: count || 0 });

    closeModal();

  });
}

async function deleteDay(dayId, studentId) {

  await supabase.from('routine_days').delete().eq('id', dayId);
  renderRoutine(studentId, true);
}

async function toggleDayVisibility(dayId, studentId) {
  const { data: current } = await supabase.from('routine_days').select('visible_to_student').eq('id', dayId).single();
  const newValue = !(current && current.visible_to_student);
  const { error } = await supabase.from('routine_days').update({ visible_to_student: newValue }).eq('id', dayId);
  if (error) {
    alert('No se pudo guardar: ' + error.message);
    return;
  }
  renderRoutine(studentId, true);
}

async function moveDay(studentId, days, dayId, direction) {
  const sorted = [...days].sort((a, b) => a.day_order - b.day_order);
  const idx = sorted.findIndex(d => d.id === dayId);
  const swapIdx = idx + direction;
  if (idx === -1 || swapIdx < 0 || swapIdx >= sorted.length) return;

  const a = sorted[idx], b = sorted[swapIdx];
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    supabase.from('routine_days').update({ day_order: b.day_order }).eq('id', a.id),
    supabase.from('routine_days').update({ day_order: a.day_order }).eq('id', b.id),
  ]);
  if (e1 || e2) {
    alert('No se pudo mover el día: ' + (e1 || e2).message);
    return;
  }
  renderRoutine(studentId, true);
}

async function moveExercise(studentId, dayId, exId, direction) {
  const { data: exercises, error: fetchError } = await supabase
    .from('exercises')
    .select('id, exercise_order')
    .eq('routine_day_id', dayId)
    .order('exercise_order');
  if (fetchError) {
    alert('No se pudo mover el ejercicio: ' + fetchError.message);
    return;
  }

  const idx = exercises.findIndex(e => e.id === exId);
  const swapIdx = idx + direction;
  if (idx === -1 || swapIdx < 0 || swapIdx >= exercises.length) return;

  const a = exercises[idx], b = exercises[swapIdx];
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    supabase.from('exercises').update({ exercise_order: b.exercise_order }).eq('id', a.id),
    supabase.from('exercises').update({ exercise_order: a.exercise_order }).eq('id', b.id),
  ]);
  if (e1 || e2) {
    alert('No se pudo mover el ejercicio: ' + (e1 || e2).message);
    return;
  }
  renderRoutine(studentId, true);
}

function openExerciseModal(dayId, studentId, exerciseId = null) {
  const isEdit = !!exerciseId;
  let pickedGif = null; // { id, name, gifUrl } — set when the user picks one

  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <h3>${isEdit ? 'Editar ejercicio' : 'Nuevo ejercicio'}</h3>
        <div class="field"><label>Nombre</label><input id="ex-name" type="text"></div>
        <div class="field"><label>Series x reps</label><input id="ex-reps" type="text" placeholder="Ej: 3x8, 10/8/6x2, 3xFallo"></div>
        <div class="field"><label>Notas</label><input id="ex-notes" type="text" placeholder="Opcional"></div>
        <div class="field">
          <label>GIF demostrativo</label>
          <div id="gif-preview" class="gif-preview-empty">Sin GIF elegido</div>
          <div class="gif-preview-actions">
            <button type="button" class="btn-secondary" id="pick-gif-btn">Elegir GIF</button>
            <button type="button" class="btn-secondary hidden" id="remove-gif-btn">Quitar</button>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">Cancelar</button>
          <button class="btn-primary" id="modal-save">Guardar</button>
        </div>
      </div>
    </div>`;

  const gifPreview = document.getElementById('gif-preview');
  const removeGifBtn = document.getElementById('remove-gif-btn');

  function renderGifPreview(url) {
    if (url) {
      gifPreview.className = '';
      gifPreview.innerHTML = `<img src="${url}" alt="preview">`;
      removeGifBtn.classList.remove('hidden');
    } else {
      gifPreview.className = 'gif-preview-empty';
      gifPreview.textContent = 'Sin GIF elegido';
      removeGifBtn.classList.add('hidden');
    }
  }

  if (isEdit) {
    supabase.from('exercises').select('*').eq('id', exerciseId).single().then(({ data }) => {
      if (!data) return;
      document.getElementById('ex-name').value = data.name || '';
      document.getElementById('ex-reps').value = data.reps || '';
      document.getElementById('ex-notes').value = data.notes || '';
      if (data.gif_url) {
        pickedGif = { gifUrl: data.gif_url };
        renderGifPreview(data.gif_url);
      }
    });
  }

  document.getElementById('pick-gif-btn').addEventListener('click', () => {
    openGifPicker((ex) => {
      pickedGif = { id: ex.id, name: ex.name, gifUrl: gifUrlFor(ex.id) };
      renderGifPreview(pickedGif.gifUrl);
      const nameInput = document.getElementById('ex-name');
      if (!nameInput.value.trim()) nameInput.value = ex.nameEs || ex.name;
    });
  });

  removeGifBtn.addEventListener('click', () => {
    pickedGif = { gifUrl: null };
    renderGifPreview(null);
  });

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async () => {
    const payload = {
      name: document.getElementById('ex-name').value.trim(),
      reps: document.getElementById('ex-reps').value.trim() || null,
      notes: document.getElementById('ex-notes').value.trim() || null,
    };
    if (pickedGif) payload.gif_url = pickedGif.gifUrl;
    if (!payload.name) return;
    if (isEdit) {
      await supabase.from('exercises').update(payload).eq('id', exerciseId);
    } else {
      const { count } = await supabase.from('exercises').select('*', { count: 'exact', head: true }).eq('routine_day_id', dayId);
      await supabase.from('exercises').insert({ ...payload, routine_day_id: dayId, exercise_order: count || 0 });
    }
    closeModal();
    renderRoutine(studentId, true);
  });
}

async function deleteExercise(exerciseId, studentId) {
  if (!confirm('¿Eliminar este ejercicio?')) return;
  await supabase.from('exercises').delete().eq('id', exerciseId);
  renderRoutine(studentId, true);
}

// ---------- Theme ----------
const themeSwitch = document.getElementById('theme-switch');
function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}
const savedTheme = localStorage.getItem('rutinas-theme') || 'dark';
applyTheme(savedTheme);
themeSwitch.addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  applyTheme(next);
  localStorage.setItem('rutinas-theme', next);
});
