<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1013;
    --bg-elevated: #17181D;
    --bg-card: #1C1D23;
    --line: #2A2C33;
    --text: #EDEDEF;
    --text-dim: #9497A0;
    --accent: #FF4429;
    --accent-soft: rgba(255,68,41,0.14);
    --accent-line: rgba(255,68,41,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.02em;
    font-weight:400;
  }
  .hidden{display:none !important;}
  button{
    font-family:'Inter', sans-serif;
    cursor:pointer;
    border:none;
    border-radius:8px;
  }
  input{
    font-family:'Inter', sans-serif;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    width:100%;
  }
  input:focus{outline:none; border-color:var(--accent-line);}

  /* ---------- Login ---------- */
  #login-view{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-box{
    width:100%;
    max-width:380px;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 32px;
  }
  .login-box .brand{
    font-size:44px;
    line-height:1;
    color:var(--accent);
    margin-bottom:4px;
  }
  .login-box .sub{
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:22px;
  }
  .tabs{
    display:flex;
    gap:4px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:9px;
    padding:3px;
    margin-bottom:24px;
  }
  .tab-btn{
    flex:1;
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    padding:8px;
    border-radius:6px;
  }
  .tab-btn.active{background:var(--accent-soft); color:var(--accent);}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:#fff;
    padding:12px;
    font-weight:600;
    font-size:14px;
    margin-top:8px;
    transition:filter 0.15s;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:0.5; cursor:default;}
  .error-msg{
    color:var(--accent);
    font-size:13px;
    margin-top:12px;
    display:none;
  }

  /* ---------- App shell ---------- */
  #app-view{
    display:flex;
    min-height:100vh;
  }
  #sidebar{
    width:260px;
    flex-shrink:0;
    background:var(--bg-elevated);
    border-right:1px solid var(--line);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
  }
  #sidebar .brand{
    font-size:28px;
    color:var(--accent);
    margin-bottom:2px;
    padding:0 8px;
  }
  #sidebar .who{
    color:var(--text-dim);
    font-size:12px;
    padding:0 8px;
    margin-bottom:24px;
  }
  #student-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .student-item{
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
  }
  .student-item:hover{background:var(--bg-card);}
  .student-item.active{background:var(--accent-soft); color:var(--accent);}
  #add-student-btn{
    background:var(--bg-card);
    color:var(--text);
    border:1px dashed var(--line);
    padding:10px;
    font-size:13px;
    margin-top:12px;
  }
  #add-student-btn:hover{border-color:var(--accent-line); color:var(--accent);}
  #logout-btn{
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    padding:10px;
    margin-top:8px;
    text-align:left;
  }
  #logout-btn:hover{color:var(--text);}

  #main-content{
    flex:1;
    padding:40px 48px;
    overflow-y:auto;
    max-width:900px;
  }
  #main-content h1{font-size:38px;}
  .subtitle{color:var(--text-dim); font-size:14px; margin-bottom:32px;}

  .empty-state{
    color:var(--text-dim);
    font-size:14px;
    padding:60px 20px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:12px;
  }

  /* day cards */
  .day-card{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .day-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .day-header .tag{
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    padding:3px 8px;
    border-radius:5px;
    margin-bottom:6px;
    text-transform:uppercase;
  }
  .day-header h3{font-size:22px;}
  .day-actions{display:flex; gap:6px;}
  .icon-btn{
    background:transparent;
    color:var(--text-dim);
    padding:6px 10px;
    font-size:12px;
    border-radius:6px;
  }
  .icon-btn:hover{background:var(--bg-card); color:var(--text);}
  .icon-btn.danger:hover{color:var(--accent);}

  table.exercise-table{
    width:100%;
    border-collapse:collapse;
  }
  table.exercise-table th{
    text-align:left;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.05em;
    padding:10px 20px;
    font-weight:600;
    border-bottom:1px solid var(--line);
  }
  table.exercise-table td{
    padding:12px 20px;
    font-size:14px;
    border-bottom:1px solid var(--line);
  }
  table.exercise-table tr:last-child td{border-bottom:none;}
  table.exercise-table td.ex-name{font-weight:600;}
  table.exercise-table td.ex-notes{color:var(--text-dim); font-size:13px;}
  .row-actions{display:flex; gap:4px; justify-content:flex-end;}

  .add-exercise-row{
    padding:10px 20px;
  }
  .add-exercise-row button{
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    padding:6px 0;
  }
  .add-exercise-row button:hover{color:var(--accent);}

  #add-day-btn{
    background:var(--bg-card);
    border:1px dashed var(--line);
    color:var(--text-dim);
    padding:14px;
    width:100%;
    font-size:14px;
  }
  #add-day-btn:hover{border-color:var(--accent-line); color:var(--accent);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px;
    width:100%;
    max-width:420px;
  }
  .modal h3{font-size:24px; margin-bottom:18px;}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn-secondary{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:10px;
    font-size:13px;
  }
  .btn-secondary:hover{color:var(--text);}
  .modal .btn-primary{flex:1; margin-top:0;}

  @media (max-width: 720px){
    #app-view{flex-direction:column;}
    #sidebar{width:100%; border-right:none; border-bottom:1px solid var(--line);}
    #main-content{padding:24px;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view">
  <div class="login-box">
    <div class="brand display">RUTINAS</div>
    <div class="tabs">
      <button type="button" class="tab-btn active" id="tab-login">Iniciar sesión</button>
      <button type="button" class="tab-btn" id="tab-signup">Crear cuenta</button>
    </div>

    <form id="login-form">
      <div class="sub">Entrá con tu email y contraseña.</div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="login-btn">Ingresar</button>
      <div class="error-msg" id="login-error"></div>
    </form>

    <form id="signup-form" class="hidden">
      <div class="sub">Creá tu cuenta de alumno. Tu profe va a ver tu nombre y armarte la rutina.</div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="signup-name" required autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="signup-btn">Crear cuenta</button>
      <div class="error-msg" id="signup-error"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app-view" class="hidden">
  <div id="sidebar">
    <div class="brand display">RUTINAS</div>
    <div class="who" id="who-am-i"></div>
    <div id="student-list"></div>
    <button id="logout-btn">Cerrar sesión</button>
  </div>
  <div id="main-content"></div>
</div>

<div id="modal-root"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ======= CONFIGURÁ ESTO =======
const SUPABASE_URL = "https://ecjlbvmqmirsyacxkzdc.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjamxidm1xbWlyc3lhY3hremRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDEwMDcsImV4cCI6MjEwMDkxNzAwN30.PPVgkiibolpFl_AlsWZYKdsgW7_6lT6PEAtK5B-8468";
// ================================

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentProfile = null;
let students = [];
let selectedStudentId = null;

const loginView = document.getElementById('login-view');
const appView = document.getElementById('app-view');
const loginForm = document.getElementById('login-form');
const loginBtn = document.getElementById('login-btn');
const loginError = document.getElementById('login-error');
const whoAmI = document.getElementById('who-am-i');
const studentList = document.getElementById('student-list');
const mainContent = document.getElementById('main-content');
const modalRoot = document.getElementById('modal-root');

// ---------- Auth ----------
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Ingresando...';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  loginBtn.textContent = 'Ingresar';
  if (error) {
    loginError.textContent = 'Email o contraseña incorrectos.';
    loginError.style.display = 'block';
    return;
  }
  await boot();
});

const tabLogin = document.getElementById('tab-login');
const tabSignup = document.getElementById('tab-signup');
const loginFormEl = document.getElementById('login-form');
const signupFormEl = document.getElementById('signup-form');

tabLogin.addEventListener('click', () => {
  tabLogin.classList.add('active');
  tabSignup.classList.remove('active');
  loginFormEl.classList.remove('hidden');
  signupFormEl.classList.add('hidden');
});
tabSignup.addEventListener('click', () => {
  tabSignup.classList.add('active');
  tabLogin.classList.remove('active');
  signupFormEl.classList.remove('hidden');
  loginFormEl.classList.add('hidden');
});

signupFormEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const signupError = document.getElementById('signup-error');
  const signupBtn = document.getElementById('signup-btn');
  signupError.style.display = 'none';
  const full_name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;

  signupBtn.disabled = true;
  signupBtn.textContent = 'Creando cuenta...';

  const { data, error } = await supabase.auth.signUp({ email, password });
  if (error || !data.user) {
    signupBtn.disabled = false;
    signupBtn.textContent = 'Crear cuenta';
    signupError.textContent = error ? error.message : 'No se pudo crear la cuenta.';
    signupError.style.display = 'block';
    return;
  }

  const { error: profileError } = await supabase.from('profiles').insert({
    id: data.user.id, full_name, is_trainer: false
  });

  signupBtn.disabled = false;
  signupBtn.textContent = 'Crear cuenta';

  if (profileError) {
    signupError.textContent = profileError.message;
    signupError.style.display = 'block';
    return;
  }

  await boot();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  location.reload();
});

async function boot() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) return; // stays on login

  const { data: profile, error } = await supabase
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    loginView.classList.remove('hidden');
    appView.classList.add('hidden');
    loginError.textContent = 'Tu cuenta no tiene un perfil asignado. Hablá con tu profe.';
    loginError.style.display = 'block';
    return;
  }

  currentProfile = profile;
  loginView.classList.add('hidden');
  appView.classList.remove('hidden');
  whoAmI.textContent = profile.is_trainer ? 'Panel del profe' : profile.full_name;

  if (profile.is_trainer) {
    await loadStudents();
  } else {
    document.getElementById('sidebar').style.display = 'none';
    selectedStudentId = profile.id;
    await renderRoutine(profile.id, false);
  }
}

// ---------- Trainer: student list ----------
async function loadStudents() {
  const { data, error } = await supabase
    .from('profiles')
    .select('*')
    .eq('is_trainer', false)
    .order('full_name');
  students = data || [];
  renderStudentList();
  if (students.length && !selectedStudentId) {
    selectStudent(students[0].id);
  } else if (!students.length) {
    mainContent.innerHTML = `<div class="empty-state">Todavía no hay alumnos registrados.<br>Cuando alguno cree su cuenta desde el link, va a aparecer acá.</div>`;
  }
}

function renderStudentList() {
  studentList.innerHTML = '';
  students.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'student-item' + (s.id === selectedStudentId ? ' active' : '');
    btn.textContent = s.full_name;
    btn.addEventListener('click', () => selectStudent(s.id));
    studentList.appendChild(btn);
  });
}

function selectStudent(id) {
  selectedStudentId = id;
  renderStudentList();
  renderRoutine(id, true);
}

// ---------- Routine rendering ----------
async function renderRoutine(studentId, editable) {
  mainContent.innerHTML = `<div class="empty-state">Cargando...</div>`;

  const { data: days } = await supabase
    .from('routine_days')
    .select('*, exercises(*)')
    .eq('student_id', studentId)
    .order('day_order');

  const student = editable ? students.find(s => s.id === studentId) : currentProfile;

  let html = `<h1>${student ? student.full_name : ''}</h1>`;
  html += `<div class="subtitle">${editable ? 'Rutina del alumno' : 'Tu rutina'}</div>`;

  if (!days || !days.length) {
    html += `<div class="empty-state">${editable ? 'Este alumno todavía no tiene rutina cargada.' : 'Tu profe todavía no cargó tu rutina.'}</div>`;
  } else {
    days.forEach((day, idx) => {
      const exercises = (day.exercises || []).sort((a,b) => a.exercise_order - b.exercise_order);
      html += `<div class="day-card">
        <div class="day-header">
          <div>
            <div class="tag">Día ${idx + 1}</div>
            <h3>${day.day_label}</h3>
          </div>
          ${editable ? `<div class="day-actions">
            <button class="icon-btn" data-action="rename-day" data-day="${day.id}">Renombrar</button>
            <button class="icon-btn danger" data-action="delete-day" data-day="${day.id}">Eliminar</button>
          </div>` : ''}
        </div>
        <table class="exercise-table">
          <thead><tr>
            <th>Ejercicio</th><th>Series</th><th>Reps</th><th>Notas</th>${editable ? '<th></th>' : ''}
          </tr></thead>
          <tbody>
            ${exercises.map(ex => `
              <tr>
                <td class="ex-name">${ex.name}</td>
                <td>${ex.sets ?? '—'}</td>
                <td>${ex.reps ?? '—'}</td>
                <td class="ex-notes">${ex.notes ?? ''}</td>
                ${editable ? `<td><div class="row-actions">
                  <button class="icon-btn" data-action="edit-exercise" data-ex="${ex.id}" data-day="${day.id}">Editar</button>
                  <button class="icon-btn danger" data-action="delete-exercise" data-ex="${ex.id}">Borrar</button>
                </div></td>` : ''}
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${editable ? `<div class="add-exercise-row">
          <button data-action="add-exercise" data-day="${day.id}">+ Agregar ejercicio</button>
        </div>` : ''}
      </div>`;
    });
  }

  if (editable) {
    html += `<button id="add-day-btn">+ Agregar día de rutina</button>`;
  }

  mainContent.innerHTML = html;

  if (editable) {
    document.getElementById('add-day-btn').addEventListener('click', () => openDayModal(studentId));
    mainContent.querySelectorAll('[data-action="rename-day"]').forEach(b =>
      b.addEventListener('click', () => openDayModal(studentId, b.dataset.day)));
    mainContent.querySelectorAll('[data-action="delete-day"]').forEach(b =>
      b.addEventListener('click', () => deleteDay(b.dataset.day, studentId)));
    mainContent.querySelectorAll('[data-action="add-exercise"]').forEach(b =>
      b.addEventListener('click', () => openExerciseModal(b.dataset.day, studentId)));
    mainContent.querySelectorAll('[data-action="edit-exercise"]').forEach(b =>
      b.addEventListener('click', () => openExerciseModal(b.dataset.day, studentId, b.dataset.ex)));
    mainContent.querySelectorAll('[data-action="delete-exercise"]').forEach(b =>
      b.addEventListener('click', () => deleteExercise(b.dataset.ex, studentId)));
  }
}

// ---------- Modals ----------
function closeModal() { modalRoot.innerHTML = ''; }

function openDayModal(studentId, dayId = null) {
  const isEdit = !!dayId;
  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <h3>${isEdit ? 'Renombrar día' : 'Nuevo día de rutina'}</h3>
        <div class="field">
          <label>Nombre del día</label>
          <input type="text" id="day-label-input" placeholder="Ej: Día 1 - Empuje">
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">Cancelar</button>
          <button class="btn-primary" id="modal-save">Guardar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async () => {
    const label = document.getElementById('day-label-input').value.trim();
    if (!label) return;
    if (isEdit) {
      await supabase.from('routine_days').update({ day_label: label }).eq('id', dayId);
    } else {
      const { count } = await supabase.from('routine_days').select('*', { count: 'exact', head: true }).eq('student_id', studentId);
      await supabase.from('routine_days').insert({ student_id: studentId, day_label: label, day_order: count || 0 });
    }
    closeModal();
    renderRoutine(studentId, true);
  });
}

async function deleteDay(dayId, studentId) {
  if (!confirm('¿Eliminar este día y todos sus ejercicios?')) return;
  await supabase.from('routine_days').delete().eq('id', dayId);
  renderRoutine(studentId, true);
}

function openExerciseModal(dayId, studentId, exerciseId = null) {
  const isEdit = !!exerciseId;
  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal">
        <h3>${isEdit ? 'Editar ejercicio' : 'Nuevo ejercicio'}</h3>
        <div class="field"><label>Nombre</label><input id="ex-name" type="text"></div>
        <div class="field"><label>Series</label><input id="ex-sets" type="number" min="0"></div>
        <div class="field"><label>Reps</label><input id="ex-reps" type="text" placeholder="Ej: 8-12"></div>
        <div class="field"><label>Notas</label><input id="ex-notes" type="text" placeholder="Opcional"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="modal-cancel">Cancelar</button>
          <button class="btn-primary" id="modal-save">Guardar</button>
        </div>
      </div>
    </div>`;

  if (isEdit) {
    supabase.from('exercises').select('*').eq('id', exerciseId).single().then(({ data }) => {
      if (!data) return;
      document.getElementById('ex-name').value = data.name || '';
      document.getElementById('ex-sets').value = data.sets ?? '';
      document.getElementById('ex-reps').value = data.reps || '';
      document.getElementById('ex-notes').value = data.notes || '';
    });
  }

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async () => {
    const payload = {
      name: document.getElementById('ex-name').value.trim(),
      sets: document.getElementById('ex-sets').value ? parseInt(document.getElementById('ex-sets').value) : null,
      reps: document.getElementById('ex-reps').value.trim() || null,
      notes: document.getElementById('ex-notes').value.trim() || null,
    };
    if (!payload.name) return;
    if (isEdit) {
      await supabase.from('exercises').update(payload).eq('id', exerciseId);
    } else {
      const { count } = await supabase.from('exercises').select('*', { count: 'exact', head: true }).eq('routine_day_id', dayId);
      await supabase.from('exercises').insert({ ...payload, routine_day_id: dayId, exercise_order: count || 0 });
    }
    closeModal();
    renderRoutine(studentId, true);
  });
}

async function deleteExercise(exerciseId, studentId) {
  if (!confirm('¿Eliminar este ejercicio?')) return;
  await supabase.from('exercises').delete().eq('id', exerciseId);
  renderRoutine(studentId, true);
}

// ---------- Init ----------
boot();
</script>
